[package]
name = "pod-graceful-drain"
description = "You don't need `lifecycle: { preStop: { exec: { command: [\"sleep\", \"30\"] } } }`"
authors = ["SeongChan Lee <foriequal@gmail.com>"]
version = "0.1.1"
edition = "2024"
rust-version = "1.100.0"

[dependencies]
# kubernetes libs
kube = { version = "3.1.0", features = ["runtime", "admission"] }
k8s-openapi = { version = "0.27.1", features = ["v1_35"] }

# async runtime libs
tokio = "1.54.1"
futures = "0.3.34"

# webhook libs
axum = { version = "0.8.9", features = ["macros"] }
axum-server = { version = "0.9.2", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23.40", default-features = false, features = ["ring"] }
rustls-pemfile = "2.2.0"

# observability libs
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-error = "0.2.1"
eyre = "0.6.14"
color-eyre = { version = "0.6.5", features = ["capture-spantrace"] }
thiserror = "2.0.21"

# auxilary libs
clap = { version = "4.6.10", features = ["derive"] }
genawaiter = { git = "https://github.com/foriequal0/genawaiter", features = ["futures03"] }
humantime = "2.4.0"
async-shutdown = "0.2.2"
serde = "1.0.229"
serde_json = "1.0.154"
json-patch = "4.2.0"
jsonptr = "0.7.1"
jiff = "0.2.46"
backon = { version = "1.6.0", default-features = false }
rand = "0.10.4"
uuid = { version = "1.29.3", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
serde_yaml = "0.9.34-deprecated"
base64 = "0.23.1"
rcgen = "0.14.10"
assert_matches = "1.5.0"

[build-dependencies]
anyhow = "1.0.105"
vergen-gitcl = { version = "10.1.0", features = ["build", "rustc"] }
